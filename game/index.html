<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Monster Smash: Siege Slingshot</title>
  </head>
  <body>
    <div id="shell">
      <div id="backdrop"></div>
      <div id="app"></div>
      <div id="desktop-hud" class="hidden" aria-hidden="true">
        <div id="hud-realm-badge" class="hud-sticker">
          <div class="hud-label">Realm</div>
          <div id="hud-realm-name" class="hud-value">Goblin Hills</div>
        </div>
        <div id="hud-controls-panel" class="hud-sticker">
          <div class="hud-title">Controls</div>
          <div class="hud-row"><span class="key">Drag</span><span class="action">Aim</span></div>
          <div class="hud-row"><span class="key">Wheel</span><span class="action">Zoom</span></div>
          <div class="hud-row"><span class="key">Space</span><span class="action">Ability</span></div>
          <div class="hud-row"><span class="key">Esc</span><span class="action">Pause</span></div>
          <div class="hud-row"><span class="key">R</span><span class="action">Restart</span></div>
          <div class="hud-row"><span class="key">M</span><span class="action">Mute</span></div>
        </div>
      </div>
    </div>

    <div id="rotate-overlay" class="hidden" aria-hidden="true">
      <div class="rotate-card">
        <div class="rotate-phone-icon">
          <svg width="54" height="54" viewBox="0 0 32 32" fill="none">
            <rect x="8" y="3" width="16" height="26" rx="3" stroke="#f4f4f4" stroke-width="2" fill="#1a1c2c"/>
            <rect x="10" y="6" width="12" height="17" fill="#111322"/>
            <circle cx="16" cy="26" r="1" fill="#ffcd75"/>
            <path d="M26 10 C 29 13, 29 19, 25 23" stroke="#ffcd75" stroke-width="2" stroke-linecap="round" fill="none"/>
            <polygon points="23,23 27,24 26,20" fill="#ffcd75"/>
          </svg>
        </div>
        <div class="rotate-title">MONSTER SMASH</div>
        <div class="rotate-sub">Siege Slingshot</div>
        <div class="rotate-msg">Rotate your device</div>
        <div class="rotate-hint">Please turn to landscape to play</div>
      </div>
    </div>

    <div id="dialog-overlay" class="hidden">
      <div id="dialog-box">
        <p>This is an HTML dialog overlaying the Phaser game area.</p>
        <button id="close-dialog-btn">Close</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
